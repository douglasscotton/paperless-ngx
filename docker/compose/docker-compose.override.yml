version: "3.9"

services:
  # Serviço de RAG (conexão Paperless -> Ollama -> LLM)
  rag_service:
    build: ../../rag_service
    container_name: rag_service
    ports:
      - "8001:8001"
    volumes:
      # monta os documentos do paperless (somente leitura)
      - ../../data:/app/data:ro
    environment:
      - OLLAMA_HOST=http://ollama:11434
    depends_on:
      - ollama

  # Ollama container (modelos LLM locais)
  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_models:/root/.ollama

volumes:
  ollama_models:
