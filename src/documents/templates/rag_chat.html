<!DOCTYPE html>
<html>
<head>
  <title>Chat RAG - Paperless</title>
</head>
<body>
<h2>💬 Chat com Documentos</h2>
<input type="text" id="rag-question" placeholder="Digite sua pergunta..." style="width:70%;">
<button id="rag-send" style="width:25%;">Enviar</button>
<div id="rag-answer" style="margin-top:0.5rem; background:#f3f3f3; padding:0.5rem;"></div>

<script>
document.getElementById('rag-send').addEventListener('click', async () => {
    const question = document.getElementById('rag-question').value;
    if (!question) return;

    const responseDiv = document.getElementById('rag-answer');
    responseDiv.innerHTML = "Carregando...";

    try {
        const res = await fetch("/api/rag/ask/", {
            method: "POST",
            headers: {"Content-Type": "application/json"},
            body: JSON.stringify({question})
        });
        const data = await res.json();
        responseDiv.innerHTML = data.answer;
    } catch(err) {
        responseDiv.innerHTML = "⚠️ Erro ao conectar ao servidor RAG.";
    }
});
</script>
</body>
</html>
